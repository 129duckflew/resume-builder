apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: backend-scaler
  namespace: resume-builder
spec:
  hosts:
    - resume.local
  pathPrefixes:
    - /api
    - /s
    - /mcp
  scaleTargetRef:
    name: resume-backend
    service: backend-service
    port: 8080
  replicas:
    min: 0
    max: 3
  targetPendingRequests: 1
  # native 冷启动 ~1s，可以更激进缩容释放节点资源（如需回退改回 300 即可）。
  scaledownPeriod: 60
