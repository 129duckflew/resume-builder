apiVersion: apps/v1
kind: Deployment
metadata:
  name: resume-backend
  namespace: resume-builder
  labels:
    app: resume-backend
spec:
  # 不写 replicas：由 KEDA (HTTPScaledObject) 管理副本数，
  # 避免 ArgoCD 与 KEDA 互相拉扯导致启动中的 Pod 被杀。
  selector:
    matchLabels:
      app: resume-backend
  template:
    metadata:
      labels:
        app: resume-backend
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "resume-builder"
        # 渲染为 Spring 配置文件（无需 shell source，镜像为 distroless 无 shell），
        # 由 SPRING_CONFIG_ADDITIONAL_LOCATION（见 configmap）加载，优先级高于打包的 application.yml。
        vault.hashicorp.com/agent-inject-secret-application-secret.yml: "secret/data/resume-builder"
        vault.hashicorp.com/agent-inject-template-application-secret.yml: |
          {{- with secret "secret/data/resume-builder" -}}
          spring:
            datasource:
              username: "{{ .Data.data.DB_USER }}"
              password: "{{ .Data.data.DB_PASS }}"
          app:
            jwt:
              secret: "{{ .Data.data.JWT_SECRET }}"
          {{- end }}
    spec:
      # host.docker.internal 走 8.8.8.8 解析会被宿主机代理 fake-ip 污染，
      # 直接钉到 lima 宿主机网关（等同 Mac 的 localhost），绕过 DNS。
      hostAliases:
        - ip: "192.168.5.2"
          hostnames:
            - host.docker.internal
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: backend
          image: ghcr.io/129duckflew/resume-builder/backend:721cb6c111b4fe66aebfbb8e5c13fbc353857532
          imagePullPolicy: IfNotPresent
          # GraalVM native 二进制，distroless 无 shell；ENTRYPOINT 已固化在镜像内。
          envFrom:
            - configMapRef:
                name: app-config
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # native 冷启动约 1s（含 DB 连接/Flyway 也就几秒）。
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 2
            failureThreshold: 30 # 最长容忍 60s 启动时间
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
