services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    container_name: resume-backend
    depends_on:
      pdf-service:
        condition: service_healthy
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: 5432
      DB_NAME: resume_db
      DB_USER: resume
      DB_PASS: resume123
      PDF_SERVICE_URL: http://pdf-service:8090
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:8080"
    volumes:
      - ./backend/src/main/resources/themes:/app/themes
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/themes"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  pdf-service:
    build:
      context: ./pdf-service
      dockerfile: Dockerfile
    container_name: resume-pdf-service
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      MAX_CONCURRENCY: "1"
      QUEUE_CAPACITY: "8"
      REQUEST_TIMEOUT: 30s
      BLOCK_EXTERNAL_RESOURCES: "true"
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resume-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80"]
      interval: 5s
      timeout: 3s
      retries: 10
